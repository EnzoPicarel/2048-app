name: Run Lab 2 script

on:
  workflow_dispatch:
  push:
    branches: [lab3]

jobs:
  run-lab2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm (official setup action)
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Ensure pnpm is available
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm nuxt typecheck

      - name: Lint
        run: pnpm eslint .

      - name: Build
        run: pnpm nuxt build

      - name: Test
        run: pnpm vitest run

      - name: Verify package works (preview)
        run: |
          pnpm nuxt preview --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          sleep 2
          curl -f http://127.0.0.1:4173 || (kill $PREVIEW_PID && exit 1)
          kill $PREVIEW_PID

      - name: Upload build output (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output
